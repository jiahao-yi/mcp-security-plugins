name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package:
          - packages/mcp-tools-list-plugin
          - packages/mcp-probe-plugin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e "${{ matrix.package }}"
      - run: python -m unittest discover -s "${{ matrix.package }}/tests" -v

