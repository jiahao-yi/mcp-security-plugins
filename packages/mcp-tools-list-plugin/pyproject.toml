[project]
name = "mcp-tools-list-plugin"
version = "0.1.0"
description = "Host-bound tool namespaces and non-instruction metadata semantics for MCP tools/list"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_tools_list_plugin"]

