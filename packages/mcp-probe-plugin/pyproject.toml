[project]
name = "mcp-probe-plugin"
version = "0.1.0"
description = "Bounded tools/list capability probing for MCP hosts"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "jsonschema>=4.20",
    "pydantic>=2.7",
]

[project.optional-dependencies]
openai = ["openai>=1.40"]
mcp = ["mcp>=1.12,<2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_probe_plugin"]

